name: test

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

defaults:
 run:
  working-directory: ./py

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-versions.py --check
      # The R package ships a committed copy of the `fastcore` crate so it builds
      # standalone on R-universe; fail if it has drifted from the canonical crate.
      - run: python3 scripts/bundle-r-core.py --check

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install -U pip wheel
          pip install pandas numpy scipy pytest maturin igraph hypothesis pyfqmr
        name: Install dependencies
      - run: |
          mkdir -p $TGT_DIR
          rm -f $TGT_DIR/*.whl
          maturin build --release --interpreter python --out $TGT_DIR
          pip install $TGT_DIR/*.whl
        name: Install package
        env:
          TGT_DIR: "target/wheels/${{ matrix.python-version }}"
      - run: pytest --verbose

  osx:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install -U pip wheel
          pip install pandas numpy scipy pytest maturin igraph hypothesis pyfqmr
        name: Install dependencies
      - run: |
          mkdir -p $TGT_DIR
          rm -f $TGT_DIR/*.whl
          maturin build --release --interpreter python --out $TGT_DIR
          pip install $TGT_DIR/*.whl
        name: Install package
        env:
          TGT_DIR: "target/wheels/${{ matrix.python-version }}"
      - run: pytest --verbose

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -U pip wheel
          pip install pandas numpy scipy pytest maturin igraph hypothesis pyfqmr
        name: Install dependencies
      - run: |
          mkdir -p dist
          maturin build --release --interpreter python --out .
          pip install (get-item navis_fastcore-*.whl)
        name: Install and test package
      - run: pytest --verbose

  # igraph backs the parity suite (`tests/test_igraph_parity.py`) as a correctness
  # oracle. It must never become a runtime dependency, so this job runs the suite
  # without it and asserts the parity tests skip rather than error.
  #
  # This job installs neither igraph nor pyfqmr (which plays the same oracle role for
  # `tests/test_simplify.py`), so it also covers the other half of that contract for
  # free: the invariant tests in that file must still run with pyfqmr absent, rather
  # than the module skipping wholesale.
  no-igraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -U pip wheel
          pip install pandas numpy scipy pytest maturin
        name: Install dependencies (deliberately no igraph)
      - run: |
          mkdir -p $TGT_DIR
          rm -f $TGT_DIR/*.whl
          maturin build --release --interpreter python --out $TGT_DIR
          pip install $TGT_DIR/*.whl
        name: Install package
        env:
          TGT_DIR: "target/wheels/no-igraph"
      - run: |
          python -c "
          import importlib.util, sys
          if importlib.util.find_spec('igraph'): sys.exit('igraph leaked into the env')
          "
        name: Assert igraph is absent
      - run: pytest --verbose